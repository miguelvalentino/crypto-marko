[theme]
# Token yang dipakai bersama oleh light & dark
baseRadius = "8px"
buttonRadius = "8px"

[theme.light]
primaryColor = "#7dff9b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f2f2"
textColor = "#1a1a1a"
borderColor = "#d6d6d6"
linkColor = "#1a7f37"
codeBackgroundColor = "#f5f5f5"
dataframeHeaderBackgroundColor = "#ededed"
dataframeHeaderTextColor = "#1a1a1a"

[theme.dark]
primaryColor = "#7dff9b"
backgroundColor = "#0b0b0b"
secondaryBackgroundColor = "#1b1b1b"
textColor = "#fafafa"
borderColor = "#3d3d3d"
linkColor = "#7dff9b"
codeBackgroundColor = "#1b1b1b"
dataframeHeaderBackgroundColor = "#202020"
dataframeHeaderTextColor = "#fafafa"

[browser]
gatherUsageStats = false
