name: Update predictions

on:
  schedule:
    # 07:30 WIB = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Paksa fetch ulang meski sudah terupdate hari ini"
        required: false
        default: true
        type: boolean

concurrency:
  group: update-predictions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Install dependencies
        run: pip install -r requirements-actions.txt

      - name: Generate predictions
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python generate_predictions.py --force --strict
          else
            python generate_predictions.py --strict
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada predictions.json."
            exit 0
          fi
          git commit -m "chore: update predictions.json [skip ci]"
          git push